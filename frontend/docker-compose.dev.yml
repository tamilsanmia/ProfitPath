services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: profitpath-dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      BACKEND_URL: http://host.docker.internal:8000
      NEXT_PUBLIC_APP_URL: https://dev.freqai.pro
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
      - next_cache:/app/.next
    command: >-
      sh -c "
      if [ ! -d node_modules ] || [ -z \"$(ls -A node_modules 2>/dev/null)\" ]; then
        CI=true pnpm install --frozen-lockfile;
      fi &&
      pnpm dev --turbopack -H 0.0.0.0 -p 3000
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: profitpath-nginx
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: profitpath-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt

  certbot-renew:
    image: certbot/certbot:latest
    container_name: profitpath-certbot-renew
    depends_on:
      - nginx
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh
    command: >-
      -c "while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h; done"
    restart: unless-stopped

volumes:
  node_modules_cache:
  next_cache:
  certbot_www:
  certbot_certs:
