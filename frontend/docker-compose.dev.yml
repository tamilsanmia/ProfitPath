services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: botprimex-dev
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
      COREPACK_HOME: /home/node/.cache/corepack
      ADMIN_USERNAME: tamilselvan_m
      BACKEND_URL: http://backend:8000
      NEXT_PUBLIC_APP_URL: https://dev.botprimex.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-491997915072-c30uof8c8ap6e0ad1o8dcvrishm4aob1.apps.googleusercontent.com}
    networks:
      - default
      - backend_net
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /dev/shm:rw,noexec,nosuid,size=64m
    pids_limit: 512
    volumes:
      - ./:/app
      - node_modules_cache:/app/node_modules
      - next_cache:/app/.next
      - corepack_cache:/home/node/.cache
    command: >-
      sh -c "
      mkdir -p /home/node/.cache/corepack &&
      chmod -R 777 /home/node/.cache &&
      if [ ! -d /app/node_modules/.bin ] || [ -z \"$(ls -A /app/node_modules/.bin 2>/dev/null)\" ]; then
        CI=true pnpm install --frozen-lockfile;
      fi &&
      pnpm dev --turbopack -H 0.0.0.0 -p 3000
      "

volumes:
  node_modules_cache:
  next_cache:
  corepack_cache:

networks:
  backend_net:
    external: true
    name: backend_default
