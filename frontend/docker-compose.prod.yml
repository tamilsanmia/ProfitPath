services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    container_name: botprimex-dev
    init: true
    user: nextjs
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: "0.0.0.0"
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      BACKEND_URL: https://api.botprimex.com
      NEXT_PUBLIC_APP_URL: https://botprimex.com
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    networks:
      - default
      - backend_net
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /dev/shm:rw,noexec,nosuid,size=64m
    pids_limit: 512
    restart: unless-stopped

networks:
  backend_net:
    external: true
    name: backend_default
