services:
  nginx:
    image: nginx:alpine
    container_name: botprimex-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: botprimex-certbot
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botprimex-backend
    expose:
      - "8000"
    env_file:
      - .env
    environment:
      BACKEND_APP_NAME: ${BACKEND_APP_NAME:-BotPrimeX Backend}
      BACKEND_DOCKER_SOCKET: ${BACKEND_DOCKER_SOCKET:-unix://var/run/docker.sock}
      BACKEND_POSTGRES_URL: ${BACKEND_POSTGRES_URL:-postgresql://postgres:postgres@postgres:5432/botprimex}
      BACKEND_REDIS_URL: ${BACKEND_REDIS_URL:-redis://redis:6379/0}
      BACKEND_FRONTEND_URL: ${BACKEND_FRONTEND_URL:-http://localhost:3000}
      BACKEND_GOOGLE_CLIENT_ID: ${BACKEND_GOOGLE_CLIENT_ID:-}
      BACKEND_SMTP_HOST: ${BACKEND_SMTP_HOST:-mailpit}
      BACKEND_SMTP_PORT: ${BACKEND_SMTP_PORT:-1025}
      BACKEND_SMTP_USER: ${BACKEND_SMTP_USER:-}
      BACKEND_SMTP_PASSWORD: ${BACKEND_SMTP_PASSWORD:-}
      BACKEND_SMTP_FROM: ${BACKEND_SMTP_FROM:-no-reply@botprimex.local}
      BACKEND_SMTP_STARTTLS: ${BACKEND_SMTP_STARTTLS:-false}
      BACKEND_SMTP_SSL: ${BACKEND_SMTP_SSL:-false}
      BACKEND_RESET_TOKEN_TTL_MINUTES: ${BACKEND_RESET_TOKEN_TTL_MINUTES:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./storage/profile-pictures:/app/storage/profile-pictures
      - ../.ssh/do:/run/secrets/deploy_ssh_key:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ../freqtrade:/app/freqtrade
    restart: unless-stopped
    networks:
      - default
      - freqaipro_net

  postgres:
    image: postgres:16-alpine
    container_name: botprimex-postgres
    environment:
      POSTGRES_DB: botprimex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d botprimex"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: botprimex-redis
    volumes:
      - ./data/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: botprimex-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

networks:
  freqaipro_net:
    external: true
    name: BotPrimeX_default
